[project]
name = "primo-api"
version = "0.1.0"
description = "Primo AI Ad Platform — FastAPI backend"
requires-python = ">=3.12"
dependencies = [
    "sentry-sdk[fastapi]>=2.19",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "celery[redis]>=5.4",
    "redis>=5.2",
    "httpx>=0.28",
    "python-jose[cryptography]>=3.3",
    "passlib[bcrypt]>=1.7",
    "boto3>=1.35",
    "pgvector>=0.3",
    "python-multipart>=0.0.12",
    "pillow>=11.0",
    "email-validator>=2.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]  # allow assert in tests

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]  # allow hardcoded test secrets

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
