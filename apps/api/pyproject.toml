[build-system]
# Declared explicitly so `pip install .` in the Docker build resolves the same
# backend everywhere, rather than relying on pip's legacy fallback.
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
# `app*` so subpackages (api, services, adapters, db.migrations) are included.
include = ["app*"]

[project]
name = "primo-api"
version = "0.1.0"
description = "Primo AI Ad Platform — FastAPI backend"
requires-python = ">=3.12"
dependencies = [
    "sentry-sdk[fastapi]>=2.19",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "celery[redis]>=5.4",
    "redis>=5.2",
    "httpx>=0.28",
    "python-jose[cryptography]>=3.3",
    # bcrypt directly, not via passlib: passlib's last release (2020) reads
    # `bcrypt.__about__`, removed in bcrypt 4.1, so it breaks on bcrypt 5.x.
    "bcrypt>=4.1",
    "boto3>=1.35",
    "pgvector>=0.3",
    "python-multipart>=0.0.12",
    "pillow>=11.0",
    "email-validator>=2.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    # Pinned deliberately. A floating linter means a new ruff release can fail CI
    # on a codebase that has not changed, which is what happened on the first run.
    "ruff==0.16.5",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]  # allow assert in tests

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]  # allow hardcoded test secrets

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency injection puts calls in argument defaults by design:
# `db: AsyncSession = Depends(get_db)`. B008 exists to catch a genuine bug — a
# mutable default evaluated once and shared across calls — which these are not,
# since FastAPI re-resolves them per request. Listing them here keeps B008 active
# for real cases instead of silencing the rule wholesale.
extend-immutable-calls = [
    "fastapi.Body",
    "fastapi.Cookie",
    "fastapi.Depends",
    "fastapi.File",
    "fastapi.Form",
    "fastapi.Header",
    "fastapi.Path",
    "fastapi.Query",
    "fastapi.Security",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
