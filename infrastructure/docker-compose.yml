services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: primo
      POSTGRES_USER: primo
      POSTGRES_PASSWORD: primo_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U primo -d primo"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ../apps/api
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    environment:
      ENVIRONMENT: development
      DATABASE_URL: postgresql+asyncpg://primo:primo_dev@postgres:5432/primo
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: dev-only-secret-change-me-in-production
      FRONTEND_URL: http://localhost:3000
      API_URL: http://localhost:8000
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      FAL_KEY: ${FAL_KEY:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      COZZIPAY_SECRET_KEY: ${COZZIPAY_SECRET_KEY:-}
    volumes:
      - ../apps/api:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ../apps/api
    command: celery -A app.workers.celery_app worker --loglevel=info
    environment:
      ENVIRONMENT: development
      DATABASE_URL: postgresql+asyncpg://primo:primo_dev@postgres:5432/primo
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: dev-only-secret-change-me-in-production
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      FAL_KEY: ${FAL_KEY:-}
    volumes:
      - ../apps/api:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: ../apps/web
    command: npm run dev
    ports:
      - "3000:3000"
    environment:
      API_INTERNAL_URL: http://api:8000
      NEXT_PUBLIC_API_URL: http://localhost:8000
    volumes:
      - ../apps/web:/app
      - /app/node_modules
    depends_on:
      - api

volumes:
  postgres_data:
